<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercer Case Prototype</title><style>body{margin:0;background:#101214;color:#eee;font:14px Arial,sans-serif}.top{padding:18px;border-bottom:1px solid #333}.ey{font-size:10px;letter-spacing:.2em;color:#bba98a}.top h1{margin:6px 0;font:22px Georgia}.meta{color:#999;font-size:11px}.tabs{display:flex;gap:5px;padding:10px;position:sticky;top:0;background:#101214}.tabs button,.btn{background:#202428;color:#ddd;border:1px solid #3b4146;border-radius:7px;padding:10px}.tabs .on{background:#343a40}.layout{display:grid;grid-template-columns:320px 1fr;gap:10px;padding:0 10px 10px}.side,.main{background:#191c1f;border:1px solid #30353a;border-radius:9px;min-height:70vh}.side{padding:10px}.item{display:block;width:100%;text-align:left;margin:6px 0;padding:11px;background:#202428;color:#eee;border:1px solid #343a40;border-radius:7px}.small{font-size:10px;color:#999;margin-top:4px}.new{float:right;color:#d8c39d}.doc{margin:22px auto;padding:28px;max-width:700px;background:#e8e3d8;color:#222;min-height:420px;font:14px/1.65 Georgia}.doc h2{margin-top:0}.readerhead{padding:18px;border-bottom:1px solid #333;font:20px Georgia}.person{padding:25px}.person h2{font:24px Georgia}.chat{padding:12px;background:#23282d;border-radius:8px;margin:8px 0}.lead{padding:12px;margin:8px 0;border:1px solid #3a4147;border-radius:8px}.done{opacity:.65;text-decoration:line-through}.note{width:100%;min-height:120px;background:#111;color:#eee;border:1px solid #444;border-radius:7px;padding:10px;box-sizing:border-box}.empty{padding:50px;text-align:center;color:#999}.locked{opacity:.5}.break{padding:35px;text-align:center}.break h2{font:26px Georgia}.choice{display:block;width:100%;margin:8px 0;padding:12px;text-align:left;background:#202428;color:#eee;border:1px solid #444;border-radius:7px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{min-height:0;max-height:38vh;overflow:auto}.main{min-height:55vh}.doc{margin:10px;padding:20px}.top{padding:14px}.tabs button{flex:1;padding:9px 4px;font-size:11px}}</style></head><body><header class="top"><div class="ey">PRIVATE CASE ARCHIVE</div><h1>MERCER / EMILY A.</h1><div class="meta">CASE #16-0419 · STATUS: REOPENED</div></header><nav class="tabs"><button data-tab="files" class="on">CASE FILES</button><button data-tab="people">PEOPLE</button><button data-tab="notes">NOTEBOOK</button></nav><div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"><div class="empty">Open any available record. The archive is incomplete.</div></main></div><script>const D={F01:['REPORT','Case Summary — 2016',`<h2>Missing Person — Emily A. Mercer</h2><p>Emily Mercer, 24, was reported missing on April 19, 2016. Her boyfriend Daniel Reyes said he last saw her that afternoon.</p><p>On April 21, a burned dark gray 2008 sedan bearing Emily's plate <b>8KJ-419</b> was recovered off County Road 8. Personal property associated with Emily was found inside.</p>`],F02:['REPORT','Burned Vehicle Report',`<h2>Burned Vehicle — County Road 8</h2><p><b>Reporting officer:</b> Officer Mark Harris</p><p>Plate recovered: 8KJ-419. Primary VIN plate unreadable due to thermal damage. Personal effects recovered: gym bag, bracelet, registration fragments.</p><p>Vehicle identification forwarded for secondary verification.</p>`],F03:['PHOTO','Burned Vehicle — Scene Photos',`<h2>Scene Photograph</h2><p style="padding:80px 20px;background:#333;color:#aaa;text-align:center">[ SIMULATED EVIDENCE PHOTO — BURNED SEDAN ]</p><p>County Road 8 · April 21, 2016.</p>`],F04:['BULLETIN','Missing Person Bulletin',`<h2>Missing — Emily Mercer</h2><p>Emily A. Mercer, 24. Vehicle: 2008 dark gray sedan. Plate: <b>8KJ-419</b>.</p>`],F05:['NEW REPORT','Vehicle Recovery — 2026',`<h2>Westway Market Parking Lot</h2><p>August 15, 2026. A dark gray 2008 sedan was located in the rear lot. Plate: <b>8KJ-419</b>. Vehicle operational, with no visible fire damage.</p><p>Registration returned to Emily A. Mercer.</p>`],F06:['PHOTO','Parking Lot — Vehicle Photos',`<h2>Recovery Photograph</h2><p style="padding:80px 20px;background:#555;color:#ddd;text-align:center">[ SIMULATED EVIDENCE PHOTO — INTACT SEDAN · 8KJ-419 ]</p>`],F07:['RECORD','DMV Vehicle Record',`<h2>Registered Vehicle — Emily Mercer</h2><p>2008 dark gray sedan · Plate 8KJ-419</p><p><b>VIN:</b> 1BG7M42K8XG184271</p>`],F08:['EVIDENCE','Evidence Intake Sheet',`<h2>Vehicle Scene — Property Log</h2><p>Plate 8KJ-419 · bracelet · gym bag.</p><p><b>Vehicle VIN:</b> Pending secondary verification.</p><p>Forwarded to Vehicle Unit — J. Keller.</p>`],F10:['REPORT','Supplemental Vehicle Examination',`<h2>Secondary Identification</h2><p>Primary VIN: destroyed / unreadable.</p><p>Secondary stamp: partial sequence recovered, inconsistent with registered Mercer VIN. Difference attributed at the time to heat deformation or transcription error.</p><p><b>Definitive secondary VIN confirmation was not obtained.</b></p>`],F11:['REPORT','2026 Vehicle Inspection',`<h2>Recovered Vehicle — Forensic Inspection</h2><p>Primary VIN: <b>1BG7M42K8XG184271</b>. Secondary VIN consistent. Service identifiers consistent with pre-2016 maintenance records.</p><p>Multiple independent identifiers establish this as Emily Mercer's original vehicle.</p>`],F12:['MEMO','Internal Memo — Mercer Notification',`<h2>Mercer Family Notification</h2><p><b>07:58 — April 21, 2016</b></p><p>Notify Mercer family that vehicle has been positively identified.</p><p>Vehicle-unit verification form had not yet been filed at the time of this memo.</p>`]};let S=JSON.parse(localStorage.mercer||'null')||{tab:'files',open:['F01','F02','F03','F04','F05','F06'],seen:[],people:['emily','daniel'],notes:'',harris:false,review:false,done:false};const P={emily:['Emily Mercer','SUBJECT'],daniel:['Daniel Reyes','UNAVAILABLE'],harris:['Officer Mark Harris','AVAILABLE'],chloe:['Chloe Mercer','RESTRICTED'],keller:['Jason Keller','NO ACCESS']};function save(){localStorage.mercer=JSON.stringify(S)}function unlock(x){if(!S.open.includes(x))S.open.push(x)}function person(x){if(!S.people.includes(x))S.people.push(x)}function progress(id){if(id==='F02')person('harris');if(S.seen.includes('F02')&&S.seen.includes('F05'))S.vehicle=true;if(id==='F08'){person('keller');unlock('F10')}if(id==='F11')unlock('F12');if(id==='F12'&&S.review)S.done=true}function openFile(id){if(!S.seen.includes(id))S.seen.push(id);progress(id);save();render();document.querySelector('#main').innerHTML=`<div class="readerhead">${D[id][1]} <button class="btn" onclick="bookmark('${id}')">Bookmark</button></div><div class="doc">${D[id][2]}</div>`}function bookmark(id){S.notes+='\\n[BOOKMARK] '+D[id][1];save();alert('Saved to Notebook')}function render(){save();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));let side=document.querySelector('#side'),main=document.querySelector('#main');if(S.done){main.innerHTML=`<div class="break"><div class="ey">CHAPTER 0 COMPLETE</div><h2>The car found in 2026 is Emily Mercer's original vehicle.</h2><p>The burned vehicle was never conclusively identified.</p><p><b>If the burned vehicle wasn't Emily's, who needed police to believe that it was?</b></p><button class="btn" onclick="alert('In the real product, account creation happens here.')">SAVE INVESTIGATION</button></div>`}if(S.tab==='files'){side.innerHTML='<div class="ey">ARCHIVE CONTENTS</div>'+S.open.map(id=>`<button class="item" onclick="openFile('${id}')"><span class="new">${S.seen.includes(id)?'':'NEW'}</span>${id} · ${D[id][1]}<div class="small">${D[id][0]}</div></button>`).join('');if(!S.done)main.innerHTML='<div class="empty">Open any available record. The archive is incomplete.</div>'}if(S.tab==='people'){side.innerHTML='<div class="ey">KNOWN PERSONS</div>'+S.people.map(id=>`<button class="item ${P[id][1]!=='AVAILABLE'?'locked':''}" onclick="openPerson('${id}')">${P[id][0]}<div class="small">${P[id][1]}</div></button>`).join('');if(!S.done)main.innerHTML='<div class="empty">Select an available person.</div>'}if(S.tab==='notes'){side.innerHTML=`<div class="ey">CURRENT LEADS</div><div class="lead">${S.vehicle?'✓ ':''}Understand why the Mercer case was reopened.</div><div class="lead ${S.review?'done':''}">Determine whether the 2016 vehicle identification can be trusted.</div>${S.vehicle&&!S.review?'<button class="btn" onclick="review()">Review vehicle lead</button>':''}`;if(!S.done)main.innerHTML=`<div class="person"><h2>Notebook</h2><p>Keep whatever matters to you. Progress is saved on this device.</p><textarea class="note" oninput="S.notes=this.value;save()">${S.notes}</textarea></div>`}}function openPerson(id){if(id!=='harris'){alert('Interview access is not available yet.');return}main.innerHTML=`<div class="person"><div class="ey">SIMULATED INTERVIEW</div><h2>Officer Mark Harris</h2><div class="chat">Plate matched. Make and color matched. Some of her belongings were inside.</div><button class="choice" onclick="ask('vin')">Was the VIN verified?</button><button class="choice" onclick="ask('family')">What do you remember about Emily's family?</button></div>`}function ask(q){if(q==='vin'){unlock('F07');unlock('F08');main.innerHTML+=`<div class="chat">The primary plate was badly damaged. Vehicle identification wasn't my assignment. The vehicle unit handled the paperwork.</div>`}else{person('chloe');main.innerHTML+=`<div class="chat">Her sister was sixteen. Chloe. I wouldn't drag her back into this.</div>`}save();renderSideOnly()}function renderSideOnly(){let old=main.innerHTML;render();main.innerHTML=old}function review(){if(!S.seen.includes('F10')){alert('You do not yet have enough evidence. Look at the vehicle identification trail.');return}main.innerHTML=`<div class="person"><h2>What can the evidence support?</h2><button class="choice" onclick="wrong()">The burned vehicle was definitely Emily's.</button><button class="choice" onclick="correct()">The burned vehicle cannot be reliably identified as Emily's original car.</button></div>`}function wrong(){alert('That goes beyond what the evidence establishes.')}function correct(){S.review=true;unlock('F11');save();alert('BREAKTHROUGH — 2016 identification was inconclusive. New evidence unlocked.');S.tab='files';render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});render();</script></body></html>
