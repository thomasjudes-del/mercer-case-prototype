a-t="files" class="on">CASE FILES</button><button data-tab="people" data-t="people">PEOPLE</button><button data-tab="notes" data-t="notebook">NOTEBOOK</button></nav><div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"><div class="empty">Open any available record.</div></main></div><script>const T={en:{archive:'PRIVATE CASE ARCHIVE',status:'STATUS: REOPENED',files:'CASE FILES',people:'PEOPLE',notebook:'NOTEBOOK',all:'ALL',reports:'REPORTS',photos:'PHOTOS',new:'NEW',read:'READ',saved:'SAVED',current:'CURRENT LEADS',notes:'MY NOTES',bookmarks:'BOOKMARKS',statusTitle:'CASE STATUS',explore:'EXPLORE FURTHER',source:'SOURCE',received:'ADDED TO CASE',bookmark:'Bookmark',unbookmark:'Remove bookmark',profile:'PROFILE',known:'KNOWN INFORMATION'},fr:{archive:'ARCHIVES PRIVÉES',status:'STATUT : RÉOUVERT',files:'DOSSIER',people:'PERSONNES',notebook:'CARNET',all:'TOUT',reports:'RAPPORTS',photos:'PHOTOS',new:'NOUVEAU',read:'LU',saved:'SIGNET',current:'PISTES EN COURS',notes:'MES NOTES',bookmarks:'SIGNETS',statusTitle:'ÉTAT DE L’ENQUÊTE',explore:'POUR ALLER PLUS LOIN',source:'SOURCE',received:'AJOUTÉ AU DOSSIER',bookmark:'Ajouter un signet',unbookmark:'Retirer le signet',profile:'PROFIL',known:'INFORMATIONS CONNUES'}};const docs={F01:{type:'report',title:{en:'Case Summary — 2016',fr:'Synthèse de l’affaire — 2016'},source:'official',sourceName:{en:'River County Police archive',fr:'Archives de la police du comté de River'},added:'2026-08-16',body:{en:`<h2>Missing Person — Emily A. Mercer</h2><p>Emily Mercer, 24, was reported missing on April 19, 2016. Her boyfriend Daniel Reyes said he last saw her that afternoon.</p><p>Two days later, a burned dark gray 2008 sedan bearing Emily's registration plate was recovered off County Road 8. Personal property associated with Emily was found inside.</p>`,fr:`<h2>Disparition — Emily A. Mercer</h2><p>Emily Mercer, 24 ans, est portée disparue le 19 avril 2016. Son compagnon Daniel Reyes déclare l’avoir vue pour la dernière fois dans l’après-midi.</p><p>Deux jours plus tard, une berline gris foncé de 2008, portant la plaque d’immatriculation d’Emily, est retrouvée incendiée près de County Road 8. Des effets personnels lui appartenant sont découverts à l’intérieur.</p>`}},F02:{type:'report',title:{en:'Burned Vehicle Report',fr:'Rapport — véhicule incendié'},source:'official',sourceName:{en:'Officer Harris / River County Police',fr:'Officer Harris / Police du comté de River'},added:'2026-08-16',body:{en:`<h2>Vehicle Recovery — County Road 8</h2><p><b>Reporting officer:</b> Officer Mark Harris</p><p>Plate recovered: 8KJ-419. Personal effects recovered: gym bag, bracelet, registration fragments.</p><p>Vehicle transferred for identification and evidence processing.</p>`,fr:`<h2>Découverte du véhicule — County Road 8</h2><p><b>Agent rédacteur :</b> Officer Mark Harris</p><p>Plaque retrouvée : 8KJ-419. Effets personnels saisis : sac de sport, bracelet, fragments de certificat d’immatriculation.</p><p>Le véhicule est transféré pour identification et traitement des éléments de preuve.</p>`}},F03:{type:'photo',title:{en:'Burned Vehicle — Scene Photo',fr:'Véhicule incendié — Photo de scène'},source:'official',sourceName:{en:'Crime-scene archive',fr:'Archives de scène'},added:'2026-08-16',body:{en:`<h2>Scene photograph</h2><div class="evidence-photo burned"></div><p>County Road 8 · April 21, 2016.</p>`,fr:`<h2>Photographie de scène</h2><div class="evidence-photo burned"></div><p>County Road 8 · 21 avril 2016.</p>`}},F04:{type:'report',title:{en:'Missing Person Bulletin',fr:'Avis de disparition'},source:'press',sourceName:{en:'Public missing-person bulletin',fr:'Avis public de disparition'},added:'2026-08-16',body:{en:`<h2>Missing — Emily Mercer</h2><p>Emily A. Mercer, 24. Vehicle: 2008 dark gray sedan. Plate: <b>8KJ-419</b>.</p>`,fr:`<h2>Disparue — Emily Mercer</h2><p>Emily A. Mercer, 24 ans. Véhicule : berline gris foncé de 2008. Plaque : <b>8KJ-419</b>.</p>`}},F05:{type:'report',title:{en:'Vehicle Recovery — 2026',fr:'Découverte d’un véhicule — 2026'},source:'official',sourceName:{en:'2026 incident report',fr:'Rapport d’intervention 2026'},added:'2026-08-16',body:{en:`<h2>Westway Market Parking Lot</h2><p>August 15, 2026. A dark gray 2008 sedan was located in the rear lot. Plate: <b>8KJ-419</b>. Vehicle operational, with no visible fire damage.</p><p>The plate returns to Emily A. Mercer.</p>`,fr:`<h2>Parking du Westway Market</h2><p>15 août 2026. Une berline gris foncé de 2008 est retrouvée sur le parking arrière. Plaque : <b>8KJ-419</b>. Le véhicule est en état de rouler et ne présente aucune trace visible d’incendie.</p><p>La plaque correspond au véhicule enregistré au nom d’Emily A. Mercer.</p>`}},F06:{type:'photo',title:{en:'Parking Lot — Vehicle Photo',fr:'Parking — Photo du véhicule'},source:'official',sourceName:{en:'Westway Market / responding officer',fr:'Westway Market / agent intervenant'},added:'2026-08-16',body:{en:`<h2>Recovery photograph</h2><div class="evidence-photo"></div><p>Westway Market · August 15, 2026.</p>`,fr:`<h2>Photographie lors de la découverte</h2><div class="evidence-photo"></div><p>Westway Market · 15 août 2026.</p>`}},F07:{type:'report',title:{en:'DMV Vehicle Record',fr:'Fiche d’immatriculation DMV'},source:'official',sourceName:{en:'DMV record',fr:'Registre DMV'},added:'2026-08-16',body:{en:`<h2>Registered Vehicle — Emily Mercer</h2><p>2008 dark gray sedan · Plate 8KJ-419</p><p><b>VIN:</b> 1BG7M42K8XG184271</p>`,fr:`<h2>Véhicule enregistré — Emily Mercer</h2><p>Berline gris foncé 2008 · Plaque 8KJ-419</p><p><b>VIN :</b> 1BG7M42K8XG184271</p>`}},F08:{type:'report',title:{en:'Evidence Intake Sheet',fr:'Bordereau des pièces saisies'},source:'official',sourceName:{en:'River County evidence room',fr:'Scellés — Police du comté'},added:'2026-08-16',body:{en:`<h2>Vehicle Scene — Property Log</h2><p>Plate 8KJ-419 · bracelet · gym bag.</p><p>Vehicle identification: pending secondary verification.</p><p>Forwarded to Vehicle Unit — J. Keller.</p>`,fr:`<h2>Scène du véhicule — Inventaire</h2><p>Plaque 8KJ-419 · bracelet · sac de sport.</p><p>Identification du véhicule : vérification secondaire en attente.</p><p>Transmis à l’unité véhicules — J. Keller.</p>`}},F10:{type:'report',title:{en:'Supplemental Vehicle Examination',fr:'Examen complémentaire du véhicule'},source:'official',sourceName:{en:'Vehicle Unit archive',fr:'Archives de l’unité véhicules'},added:'2026-08-16',body:{en:`<h2>Secondary Identification</h2><p>The primary identification point could not be relied upon after the fire. A secondary identifier was partially recovered but did not fully match the Mercer registration record.</p><p>The discrepancy was not conclusively resolved in the archived paperwork.</p>`,fr:`<h2>Identification secondaire</h2><p>Le point d’identification principal ne permettait plus une lecture fiable après l’incendie. Un identifiant secondaire a été partiellement relevé, sans correspondre totalement au dossier d’immatriculation Mercer.</p><p>Les archives ne montrent pas que cette divergence ait été définitivement résolue.</p>`}},F11:{type:'report',title:{en:'2026 Vehicle Inspection',fr:'Inspection du véhicule — 2026'},source:'official',sourceName:{en:'2026 forensic inspection',fr:'Inspection technique 2026'},added:'2026-08-16',body:{en:`<h2>Recovered Vehicle — Inspection</h2><p>Multiple independent identifiers are consistent with Emily Mercer's registered 2008 vehicle and its pre-2016 maintenance records.</p>`,fr:`<h2>Véhicule retrouvé — Inspection</h2><p>Plusieurs identifiants indépendants concordent avec le véhicule de 2008 enregistré au nom d’Emily Mercer et avec ses dossiers d’entretien antérieurs à 2016.</p>`}},F12:{type:'report',title:{en:'Internal Memo — Mercer Notification',fr:'Note interne — Information de la famille Mercer'},source:'private',sourceName:{en:'Internal police memo',fr:'Note interne de police'},added:'2026-08-16',body:{en:`<h2>Mercer Family Notification</h2><p><b>07:58 — April 21, 2016</b></p><p>Notify Mercer family that vehicle has been positively identified.</p><p>The vehicle-unit verification form is timestamped later that day.</p>`,fr:`<h2>Information de la famille Mercer</h2><p><b>07:58 — 21 avril 2016</b></p><p>Informer la famille Mercer que le véhicule a été formellement identifié.</p><p>Le formulaire de vérification de l’unité véhicules porte un horaire postérieur le même jour.</p>`}}};const persons={emily:{name:'Emily Mercer',role:{en:'Missing person',fr:'Personne disparue'},status:{en:'Subject',fr:'Sujet principal'},facts:{en:['24 years old at disappearance','Missing since April 19, 2016'],fr:['24 ans lors de sa disparition','Disparue depuis le 19 avril 2016']}},daniel:{name:'Daniel Reyes',role:{en:'Boyfriend at the time',fr:'Compagnon à l’époque'},status:{en:'Interview unavailable',fr:'Entretien indisponible'},facts:{en:['Reported last seeing Emily on April 19'],fr:['Déclare avoir vu Emily pour la dernière fois le 19 avril']}},harris:{name:'Officer Mark Harris',role:{en:'Officer on original case',fr:'Agent sur l’enquête initiale'},status:{en:'Available for interview',fr:'Disponible pour entretien'},facts:{en:['Responded to the burned vehicle scene'],fr:['Intervenu sur la scène du véhicule incendié']}},chloe:{name:'Chloe Mercer',role:{en:'Younger sister',fr:'Sœur cadette'},status:{en:'Interview restricted',fr:'Entretien restreint'},facts:{en:['Sixteen in 2016'],fr:['16 ans en 2016']}},keller:{name:'Jason Keller',role:{en:'Vehicle-unit cadet in 2016',fr:'Stagiaire de l’unité véhicules en 2016'},status:{en:'No interview access',fr:'Aucun accès entretien'},facts:{en:['Named on vehicle-processing paperwork'],fr:['Mentionné sur les documents de traitement du véhicule']}}};let S=JSON.parse(localStorage.mercerV2||'null')||{lang:'en',tab:'files',filter:'all',open:['F01','F02','F03','F04','F05','F06'],seen:[],bookmarks:[],people:['emily','daniel'],notes:'',vehicle:false,review:false,done:false};function save(){localStorage.mercerV2=JSON.stringify(S)}function tr(k){return T[S.lang][k]||k}function setLang(x){S.lang=x;save();render()}function unlock(x){if(!S.open.includes(x))S.open.push(x)}function person(x){if(!S.people.includes(x))S.people.push(x)}function progress(id){if(id==='F02')person('harris');if(S.seen.includes('F02')&&S.seen.includes('F05'))S.vehicle=true;if(id==='F08'){person('keller');unlock('F10')}if(id==='F11')unlock('F12');if(id==='F12'&&S.review)S.done=true}function icon(d){return d.type==='photo'?'▧':'▤'}function sourceBadge(d){return `<span class="badge ${d.source}">${d.source}</span>`}function render(){save();document.documentElement.lang=S.lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));enBtn.classList.toggle('on',S.lang==='en');frBtn.classList.toggle('on',S.lang==='fr');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));let side=document.querySelector('#side'),main=document.querySelector('#main');if(S.tab==='files'){let available=S.open.filter(id=>S.filter==='all'||docs[id].type===S.filter||(S.filter==='saved'&&S.bookmarks.includes(id))||(S.filter==='new'&&!S.seen.includes(id)));side.innerHTML=`<div class="ey">${tr('files')}</div><div class="toolbar"><button class="chip ${S.filter==='all'?'on':''}" onclick="setFilter('all')">${tr('all')}</button><button class="chip ${S.filter==='report'?'on':''}" onclick="setFilter('report')">${tr('reports')}</button><button class="chip ${S.filter==='photo'?'on':''}" onclick="setFilter('photo')">${tr('photos')}</button><button class="chip ${S.filter==='new'?'on':''}" onclick="setFilter('new')">${tr('new')}</button><button class="chip ${S.filter==='saved'?'on':''}" onclick="setFilter('saved')">${tr('saved')}</button></div>`+available.map(id=>{let d=docs[id];return `<button class="item ${S.seen.includes(id)?'read':''}" onclick="openFile('${id}')"><span class="flags">${!S.seen.includes(id)?'● ':''}${S.bookmarks.includes(id)?'★':''}</span>${icon(d)} ${d.title[S.lang]}<div class="small">${d.added}</div><div class="badges">${sourceBadge(d)}<span class="badge">${d.type}</span>${S.seen.includes(id)?`<span class="badge">${tr('read')}</span>`:''}</div></button>`}).join('');if(!S.done)main.innerHTML='<div class="empty">'+(S.lang==='fr'?'Ouvrez une pièce du dossier.':'Open any available record.')+'</div>'}if(S.tab==='people'){side.innerHTML=`<div class="ey">${tr('people')}</div>`+S.people.map(id=>{let p=persons[id];return `<button class="item ${id!=='harris'?'locked':''}" onclick="openPerson('${id}')">${p.name}<div class="small">${p.role[S.lang]} · ${p.status[S.lang]}</div></button>`}).join('');if(!S.done)main.innerHTML='<div class="empty">'+(S.lang==='fr'?'Sélectionnez une personne pour ouvrir son profil.':'Select a person to open their profile.')+'</div>'}if(S.tab==='notes'){renderNotebook(side,main)}if(S.done){main.innerHTML=`<div class="break"><div class="ey">CHAPTER 0 COMPLETE</div><h2>${S.lang==='fr'?"La voiture retrouvée en 2026 est bien le véhicule d’origine d’Emily Mercer.":"The car found in 2026 is Emily Mercer's original vehicle."}</h2><p>${S.lang==='fr'?"Le véhicule incendié en 2016 n’avait jamais été identifié de manière concluante.":"The burned vehicle was never conclusively identified."}</p><button class="btn" onclick="alert('${S.lang==='fr'?'Dans le produit réel, la création du compte se ferait ici.':'In the real product, account creation happens here.'}')">${S.lang==='fr'?'SAUVEGARDER L’ENQUÊTE':'SAVE INVESTIGATION'}</button></div>`}}function setFilter(x){S.filter=x;render()}function openFile(id){if(!S.seen.includes(id))S.seen.push(id);progress(id);save();render();let d=docs[id];main.innerHTML=`<div class="readerhead"><div><div class="ey">${icon(d)} ${d.type}</div><h2>${d.title[S.lang]}</h2></div><button class="btn" onclick="toggleBookmark('${id}')">${S.bookmarks.includes(id)?tr('unbookmark'):tr('bookmark')}</button></div><div class="sourcebox"><b>${tr('source')}:</b> ${d.sourceName[S.lang]} &nbsp; · &nbsp; <b>${tr('received')}:</b> ${d.added}</div><div class="doc">${d.body[S.lang]}</div>`}function toggleBookmark(id){let i=S.bookmarks.indexOf(id);if(i>=0)S.bookmarks.splice(i,1);else S.bookmarks.push(id);save();openFile(id)}function openPerson(id){let p=persons[id];main.innerHTML=`<div class="person"><div class="profile"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('')}</div><div><div class="ey">${tr('profile')}</div><h2>${p.name}</h2><div class="role">${p.role[S.lang]}</div><div class="small">${p.status[S.lang]}</div></div></div><div class="facts"><div class="ey">${tr('known')}</div>${p.facts[S.lang].map(x=>`<div class="fact">${x}</div>`).join('')}</div>${id==='harris'?`<div class="facts"><button class="btn" onclick="startHarris()">${S.lang==='fr'?'INTERROGER HARRIS':'INTERVIEW HARRIS'}</button></div>`:''}</div>`}function startHarris(){main.innerHTML=`<div class="person"><div class="ey">${S.lang==='fr'?'ENTRETIEN SIMULÉ':'SIMULATED INTERVIEW'}</div><h2>Officer Mark Harris</h2><div class="chat">${S.lang==='fr'?"La plaque correspondait. Le modèle et la couleur aussi. Des affaires d’Emily étaient à l’intérieur.":"Plate matched. Make and color matched. Some of her belongings were inside."}</div><button class="choice" onclick="ask('id')">${S.lang==='fr'?"Comment le véhicule a-t-il été formellement identifié ?":"How was the vehicle formally identified?"}</button><button class="choice" onclick="ask('family')">${S.lang==='fr'?"Que vous rappelez-vous de la famille Mercer ?":"What do you remember about the Mercer family?"}</button></div>`}function ask(q){if(q==='id'){unlock('F07');unlock('F08');main.innerHTML+=`<div class="chat">${S.lang==='fr'?"Ce n’était pas mon travail. L’unité véhicules a traité l’identification et les documents.":"That wasn't my assignment. The vehicle unit handled the identification and paperwork."}</div>`}else{person('chloe');main.innerHTML+=`<div class="chat">${S.lang==='fr'?"Sa sœur avait seize ans. Chloe. Je ne la mêlerais pas de nouveau à cette affaire.":"Her sister was sixteen. Chloe. I wouldn't drag her back into this."}</div>`}save();renderSideOnly()}function renderSideOnly(){let old=main.innerHTML;render();main.innerHTML=old}function renderNotebook(side,main){let facts=[];if(S.seen.includes('F01'))facts.push(S.lang==='fr'?'Emily a disparu le 19 avril 2016.':'Emily disappeared on April 19, 2016.');if(S.seen.includes('F05'))facts.push(S.lang==='fr'?'Une voiture portant sa plaque a été retrouvée en 2026.':'A car bearing her plate was recovered in 2026.');if(S.review)facts.push(S.lang==='fr'?"L’identification du véhicule de 2016 n’était pas concluante.":'The 2016 vehicle identification was inconclusive.');side.innerHTML=`<div class="ey">${tr('current')}</div><div class="lead ${S.vehicle?'done':'active'}">${S.lang==='fr'?"Comprendre pourquoi l’affaire Mercer a été rouverte.":'Understand why the Mercer case was reopened.'}</div><div class="lead ${S.review?'done':'active'}">${S.lang==='fr'?"Établir si l’identification du véhicule de 2016 est fiable.":'Determine whether the 2016 vehicle identification can be trusted.'}</div>${S.vehicle&&!S.review?`<button class="btn" onclick="review()">${S.lang==='fr'?'EXAMINER CETTE PISTE':'REVIEW THIS LEAD'}</button>`:''}`;main.innerHTML=`<div class="section"><h3>${tr('statusTitle')}</h3><div class="summary-group"><b>${S.lang==='fr'?'Ce que nous pouvons établir':'What can be established'}</b>${facts.length?facts.map(x=>`<div class="fact">${x}</div>`).join(''):`<div class="small">${S.lang==='fr'?'Encore trop tôt pour établir des conclusions.':'Too early for firm conclusions.'}</div>`}</div><div class="summary-group"><b>Officer Harris</b><div class="small">${S.lang==='fr'?"Source policière. Ses déclarations doivent être comparées aux documents du dossier.":"Police source. His statements should be compared with the archived paperwork."}</div></div></div><div class="section"><h3>${tr('bookmarks')}</h3>${S.bookmarks.length?S.bookmarks.map(id=>`<div class="bookmark" onclick="S.tab='files';render();openFile('${id}')">★ ${docs[id].title[S.lang]}</div>`).join(''):`<div class="small">${S.lang==='fr'?'Aucun signet pour le moment.':'No bookmarked evidence yet.'}</div>`}</div><div class="section"><h3>${tr('notes')}</h3><textarea class="note" oninput="S.notes=this.value;save()">${S.notes}</textarea></div><div class="section"><h3>${tr('explore')}</h3><div class="research-card">${S.lang==='fr'?"Identification d’un véhicule après incendie — quels éléments sont normalement vérifiés ?":"Vehicle identification after a severe fire — what is normally checked?"}</div><div class="research-card">${S.lang==='fr'?"Chaîne de conservation des preuves et erreurs administratives dans les cold cases.":"Evidence chain-of-custody and administrative error in cold cases."}</div><div class="research-card">${S.lang==='fr'?"Comment distinguer une plaque d’immatriculation d’un identifiant propre au véhicule ?":"How registration plates differ from vehicle-specific identifiers."}</div><div class="small">${S.lang==='fr'?"Ces pistes sont ici simulées. Dans une version ultérieure, elles pourront ouvrir des ressources, archives ou recherches supplémentaires.":"These are simulated research avenues. A later version can open additional resources, archives or research material."}</div></div>`}function review(){if(!S.seen.includes('F10')){alert(S.lang==='fr'?"Vous n’avez pas encore suffisamment d’éléments. Examinez la chaîne d’identification du véhicule.":'You do not yet have enough evidence. Examine the vehicle-identification trail.');return}main.innerHTML=`<div class="person"><h2>${S.lang==='fr'?"Que permettent réellement d’établir les pièces disponibles ?":"What does the available evidence actually establish?"}</h2><button class="choice" onclick="wrong()">${S.lang==='fr'?"Le véhicule incendié était formellement celui d’Emily.":"The burned vehicle was conclusively Emily's."}</button><button class="choice" onclick="correct()">${S.lang==='fr'?"Les pièces disponibles ne permettent pas d’identifier de façon fiable le véhicule incendié comme celui d’Emily.":"The available evidence does not reliably identify the burned vehicle as Emily's original car."}</button></div>`}function wrong(){alert(S.lang==='fr'?"Cette conclusion va au-delà de ce que les pièces permettent d’établir.":'That conclusion goes beyond what the evidence establishes.')}function correct(){S.review=true;unlock('F11');save();alert(S.lang==='fr'?"AVANCÉE — l’identification de 2016 n’était pas concluante. Une nouvelle pièce est disponible.":'BREAKTHROUGH — the 2016 identification was inconclusive. New evidence unlocked.');S.tab='files';render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});render();</script></body></html>
