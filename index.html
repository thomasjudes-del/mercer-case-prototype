ss="tabwrap"><button data-tab="people" id="tabPeople">PEOPLE</button><i id="dotPeople"></i></div><div class="tabwrap"><button data-tab="notes" id="tabNotes">NOTEBOOK</button><i id="dotNotes"></i></div></nav><div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><script>const I={report:'▤',photo:'▧',audio:'◉',video:'▶'};const T={en:{archive:'PRIVATE CASE ARCHIVE',status:'STATUS: REOPENED',files:'CASE FILES',people:'PEOPLE',notes:'NOTEBOOK',all:'ALL',reports:'REPORTS',photos:'PHOTOS',unread:'UNREAD',saved:'SAVED',current:'CURRENT LEADS',mynotes:'MY NOTES',bookmarks:'BOOKMARKS',caseStatus:'CASE STATUS',further:'EXPLORE FURTHER',bookmark:'☆',unbookmark:'★',source:'SOURCE',added:'RECEIVED'},fr:{archive:'ARCHIVES PRIVÉES',status:'STATUT : RÉOUVERT',files:'DOSSIER',people:'PERSONNES',notes:'CARNET',all:'TOUT',reports:'RAPPORTS',photos:'PHOTOS',unread:'NON LUS',saved:'SIGNETS',current:'PISTES EN COURS',mynotes:'MES NOTES',bookmarks:'SIGNETS',caseStatus:'ÉTAT DE L’ENQUÊTE',further:'POUR ALLER PLUS LOIN',bookmark:'☆',unbookmark:'★',source:'SOURCE',added:'REÇU'}};const D={F01:{type:'report',src:'official',title:{en:'Case Summary — 2016',fr:'Synthèse de l’affaire — 2016'},from:{en:'River County Police archive',fr:'Archives de la police du comté'},date:'16 Aug 2026',body:{en:`<h2>Missing Person — Emily A. Mercer</h2><p>Emily Mercer, 24, was reported missing on April 19, 2016. Her boyfriend Daniel Reyes said he last saw her that afternoon.</p><p>Two days later, a burned dark gray 2008 sedan bearing Emily's registration plate was recovered off County Road 8. Personal property associated with Emily was found inside.</p>`,fr:`<h2>Disparition — Emily A. Mercer</h2><p>Emily Mercer, 24 ans, est portée disparue le 19 avril 2016. Son compagnon Daniel Reyes déclare l’avoir vue pour la dernière fois dans l’après-midi.</p><p>Deux jours plus tard, une berline gris foncé de 2008 portant sa plaque est retrouvée incendiée près de County Road 8. Des effets personnels lui appartenant sont découverts à l’intérieur.</p>`}},F02:{type:'report',src:'official',title:{en:'Burned Vehicle Report',fr:'Rapport — véhicule incendié'},from:{en:'Officer Harris / River County Police',fr:'Officer Harris / Police du comté'},date:'16 Aug 2026',body:{en:`<h2>Vehicle Recovery — County Road 8</h2><p><b>Reporting officer:</b> Officer Mark Harris</p><p>Plate recovered: 8KJ-419. Personal effects recovered: gym bag, bracelet, registration fragments.</p><p>Vehicle transferred for identification and evidence processing.</p>`,fr:`<h2>Découverte du véhicule — County Road 8</h2><p><b>Agent rédacteur :</b> Officer Mark Harris</p><p>Plaque retrouvée : 8KJ-419. Effets personnels saisis : sac de sport, bracelet, fragments de certificat d’immatriculation.</p><p>Le véhicule est transféré pour identification et traitement des éléments de preuve.</p>`}},F03:{type:'photo',src:'official',title:{en:'Burned Vehicle — Scene Photo',fr:'Véhicule incendié — Photo de scène'},from:{en:'Crime-scene archive',fr:'Archives de scène'},date:'16 Aug 2026',body:{en:`<h2>Scene photograph</h2><div class="photo-placeholder">REALISTIC GENERATED EVIDENCE PHOTO WILL REPLACE THIS PLACEHOLDER</div><p>County Road 8 · April 21, 2016.</p>`,fr:`<h2>Photographie de scène</h2><div class="photo-placeholder">UNE PHOTOGRAPHIE RÉALISTE GÉNÉRÉE REMPLACERA CE PLACEHOLDER</div><p>County Road 8 · 21 avril 2016.</p>`}},F04:{type:'report',src:'press',title:{en:'Missing Person Bulletin',fr:'Avis de disparition'},from:{en:'Public bulletin / local press',fr:'Avis public / presse locale'},date:'16 Aug 2026',body:{en:`<h2>Missing — Emily Mercer</h2><p>Emily A. Mercer, 24. Vehicle: 2008 dark gray sedan. Plate: <b>8KJ-419</b>.</p>`,fr:`<h2>Disparue — Emily Mercer</h2><p>Emily A. Mercer, 24 ans. Véhicule : berline gris foncé de 2008. Plaque : <b>8KJ-419</b>.</p>`}},F05:{type:'report',src:'official',title:{en:'Vehicle Recovery — 2026',fr:'Découverte d’un véhicule — 2026'},from:{en:'2026 incident report',fr:'Rapport d’intervention 2026'},date:'16 Aug 2026',body:{en:`<h2>Westway Market Parking Lot</h2><p>August 15, 2026. A dark gray 2008 sedan was located in the rear lot. Plate: <b>8KJ-419</b>. Vehicle operational, with no visible fire damage.</p>`,fr:`<h2>Parking du Westway Market</h2><p>15 août 2026. Une berline gris foncé de 2008 est retrouvée sur le parking arrière. Plaque : <b>8KJ-419</b>. Le véhicule est en état de rouler et ne présente aucune trace visible d’incendie.</p>`}},F06:{type:'photo',src:'official',title:{en:'Parking Lot — Vehicle Photo',fr:'Parking — Photo du véhicule'},from:{en:'Westway Market / responding officer',fr:'Westway Market / agent intervenant'},date:'16 Aug 2026',body:{en:`<h2>Recovery photograph</h2><div class="photo-placeholder">REALISTIC GENERATED PARKING-LOT PHOTO WILL REPLACE THIS PLACEHOLDER</div><p>Westway Market · August 15, 2026.</p>`,fr:`<h2>Photographie lors de la découverte</h2><div class="photo-placeholder">UNE PHOTOGRAPHIE RÉALISTE DU PARKING REMPLACERA CE PLACEHOLDER</div><p>Westway Market · 15 août 2026.</p>`}},F07:{type:'report',src:'official',title:{en:'DMV Vehicle Record',fr:'Fiche d’immatriculation DMV'},from:{en:'DMV record',fr:'Registre DMV'},date:'16 Aug 2026',body:{en:`<h2>Registered Vehicle — Emily Mercer</h2><p>2008 dark gray sedan · Plate 8KJ-419</p><p><b>VIN:</b> 1BG7M42K8XG184271</p>`,fr:`<h2>Véhicule enregistré — Emily Mercer</h2><p>Berline gris foncé 2008 · Plaque 8KJ-419</p><p><b>VIN :</b> 1BG7M42K8XG184271</p>`}},F08:{type:'report',src:'official',title:{en:'Evidence Intake Sheet',fr:'Bordereau des pièces saisies'},from:{en:'River County evidence room',fr:'Scellés — Police du comté'},date:'16 Aug 2026',body:{en:`<h2>Vehicle Scene — Property Log</h2><p>Plate 8KJ-419 · bracelet · gym bag.</p><p>Vehicle identification: pending secondary verification.</p><p>Forwarded to Vehicle Unit — J. Keller.</p>`,fr:`<h2>Scène du véhicule — Inventaire</h2><p>Plaque 8KJ-419 · bracelet · sac de sport.</p><p>Identification du véhicule : vérification secondaire en attente.</p><p>Transmis à l’unité véhicules — J. Keller.</p>`}},F10:{type:'report',src:'official',title:{en:'Supplemental Vehicle Examination',fr:'Examen complémentaire du véhicule'},from:{en:'Vehicle Unit archive',fr:'Archives de l’unité véhicules'},date:'16 Aug 2026',body:{en:`<h2>Secondary Identification</h2><p>A secondary identifier was partially recovered but did not fully match the Mercer registration record.</p><p>The discrepancy was not conclusively resolved in the archived paperwork.</p>`,fr:`<h2>Identification secondaire</h2><p>Un identifiant secondaire a été partiellement relevé sans correspondre totalement au dossier d’immatriculation Mercer.</p><p>Les archives ne montrent pas que cette divergence ait été définitivement résolue.</p>`}},F11:{type:'report',src:'official',title:{en:'2026 Vehicle Inspection',fr:'Inspection du véhicule — 2026'},from:{en:'2026 forensic inspection',fr:'Inspection technique 2026'},date:'16 Aug 2026',body:{en:`<h2>Recovered Vehicle — Inspection</h2><p>Multiple independent identifiers are consistent with Emily Mercer's registered 2008 vehicle and its pre-2016 maintenance records.</p>`,fr:`<h2>Véhicule retrouvé — Inspection</h2><p>Plusieurs identifiants indépendants concordent avec le véhicule de 2008 enregistré au nom d’Emily Mercer et avec ses dossiers d’entretien antérieurs à 2016.</p>`}},F12:{type:'report',src:'private',title:{en:'Internal Memo — Mercer Notification',fr:'Note interne — Information famille Mercer'},from:{en:'Internal police memo',fr:'Note interne de police'},date:'16 Aug 2026',body:{en:`<h2>Mercer Family Notification</h2><p><b>07:58 — April 21, 2016</b></p><p>Notify Mercer family that vehicle has been positively identified.</p><p>The vehicle-unit verification form is timestamped later that day.</p>`,fr:`<h2>Information de la famille Mercer</h2><p><b>07:58 — 21 avril 2016</b></p><p>Informer la famille Mercer que le véhicule a été formellement identifié.</p><p>Le formulaire de vérification de l’unité véhicules porte un horaire postérieur le même jour.</p>`}}};const P={emily:{name:'Emily Mercer',role:{en:'Missing person',fr:'Personne disparue'},status:{en:'Subject',fr:'Sujet'},facts:{en:['24 at disappearance','Missing since April 19, 2016'],fr:['24 ans lors de sa disparition','Disparue depuis le 19 avril 2016']}},daniel:{name:'Daniel Reyes',role:{en:'Boyfriend at the time',fr:'Compagnon à l’époque'},status:{en:'Interview unavailable',fr:'Entretien indisponible'},facts:{en:['Reported last seeing Emily on April 19'],fr:['Déclare avoir vu Emily pour la dernière fois le 19 avril']}},harris:{name:'Officer Mark Harris',role:{en:'Officer on original case',fr:'Agent sur l’enquête initiale'},status:{en:'Available',fr:'Disponible'},facts:{en:['Responded to burned vehicle scene'],fr:['Intervenu sur la scène du véhicule incendié']}},chloe:{name:'Chloe Mercer',role:{en:'Younger sister',fr:'Sœur cadette'},status:{en:'Restricted',fr:'Accès restreint'},facts:{en:['Sixteen in 2016'],fr:['16 ans en 2016']}},keller:{name:'Jason Keller',role:{en:'Vehicle-unit cadet',fr:'Stagiaire unité véhicules'},status:{en:'No access',fr:'Aucun accès'},facts:{en:['Named on vehicle paperwork'],fr:['Mentionné sur les documents du véhicule']}}};let S=JSON.parse(localStorage.mercerV3||'null')||{lang:'en',tab:'files',filter:'all',open:['F01','F02','F03','F04','F05','F06'],seen:[],bookmarks:[],people:['emily','daniel'],seenPeople:[],notes:'',vehicle:false,review:false,done:false,notesSeen:false};function save(){localStorage.mercerV3=JSON.stringify(S)}function tr(k){return T[S.lang][k]}function setLang(x){S.lang=x;render()}function unlock(id){if(!S.open.includes(id))S.open.push(id)}function addPerson(id){if(!S.people.includes(id))S.people.push(id)}function progress(id){if(id==='F02')addPerson('harris');if(S.seen.includes('F02')&&S.seen.includes('F05'))S.vehicle=true;if(id==='F08'){addPerson('keller');unlock('F10')}if(id==='F11')unlock('F12');if(id==='F12'&&S.review)S.done=true}function newFiles(){return S.open.some(id=>!S.seen.includes(id))}function newPeople(){return S.people.some(id=>!S.seenPeople.includes(id))}function updateDots(){dotFiles.className=newFiles()?'dot':'';dotPeople.className=newPeople()?'dot':'';dotNotes.className=(!S.notesSeen&&(S.vehicle||S.review))?'dot':''}function render(){save();archive.textContent=tr('archive');status.textContent=tr('status');tabFiles.textContent=tr('files');tabPeople.textContent=tr('people');tabNotes.textContent=tr('notes');enBtn.classList.toggle('on',S.lang==='en');frBtn.classList.toggle('on',S.lang==='fr');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));updateDots();if(S.tab==='files')renderFiles();if(S.tab==='people')renderPeople();if(S.tab==='notes')renderNotes();if(S.done)main.innerHTML=`<div class="break"><div class="ey">CHAPTER 0 COMPLETE</div><h2>${S.lang==='fr'?"La voiture retrouvée en 2026 est le véhicule d’origine d’Emily Mercer.":"The car found in 2026 is Emily Mercer's original vehicle."}</h2><button class="btn">${S.lang==='fr'?'SAUVEGARDER L’ENQUÊTE':'SAVE INVESTIGATION'}</button></div>`}function renderFiles(){let arr=S.open.filter(id=>S.filter==='all'||D[id].type===S.filter||(S.filter==='unread'&&!S.seen.includes(id))||(S.filter==='saved'&&S.bookmarks.includes(id)));side.innerHTML=`<div class="ey">${tr('files')}</div><div class="toolbar"><button class="chip ${S.filter==='all'?'on':''}" onclick="filter('all')">${tr('all')}</button><button class="chip ${S.filter==='report'?'on':''}" onclick="filter('report')">${tr('reports')}</button><button class="chip ${S.filter==='photo'?'on':''}" onclick="filter('photo')">${tr('photos')}</button><button class="chip ${S.filter==='unread'?'on':''}" onclick="filter('unread')">${tr('unread')}</button><button class="chip ${S.filter==='saved'?'on':''}" onclick="filter('saved')">${tr('saved')}</button></div>`+arr.map(id=>{let d=D[id];return `<button class="item src-${d.src} ${S.seen.includes(id)?'read':''}" onclick="openFile('${id}')"><div class="itemrow"><span class="ico">${I[d.type]}</span><span class="itemtitle"><b>${d.title[S.lang]}</b><span class="sub">${d.from[S.lang]}</span></span><span class="stateicons">${!S.seen.includes(id)?'<i class="unread"></i>':''}${S.bookmarks.includes(id)?'<span class="star">★</span>':''}</span></div></button>`}).join('');main.innerHTML=`<div class="empty">${S.lang==='fr'?'Ouvrez une pièce du dossier.':'Open any available record.'}</div>`}function filter(x){S.filter=x;render()}function openFile(id){if(!S.seen.includes(id))S.seen.push(id);progress(id);save();renderFiles();let d=D[id];main.innerHTML=`<div class="readerhead"><div><div class="ey">${I[d.type]}</div><h2>${d.title[S.lang]}</h2></div><button class="btn" onclick="toggleBookmark('${id}')">${S.bookmarks.includes(id)?'★':'☆'}</button></div><div class="sourcebox"><b>${tr('source')}:</b> ${d.from[S.lang]} · <b>${tr('added')}:</b> ${d.date}</div><div class="doc">${d.body[S.lang]}</div>`;updateDots()}function toggleBookmark(id){let i=S.bookmarks.indexOf(id);i>=0?S.bookmarks.splice(i,1):S.bookmarks.push(id);save();openFile(id)}function renderPeople(){S.people.forEach(id=>{if(!S.seenPeople.includes(id))S.seenPeople.push(id)});save();side.innerHTML=`<div class="ey">${tr('people')}</div>`+S.people.map(id=>{let p=P[id];return `<button class="item" onclick="openPerson('${id}')"><div class="personcard"><div class="portrait">${p.name.split(' ').map(x=>x[0]).join('')}</div><div><b>${p.name}</b><div class="sub">${p.status[S.lang]}</div></div><div class="rolepill">${p.role[S.lang]}</div></div></button>`}).join('');main.innerHTML=`<div class="empty">${S.lang==='fr'?'Ouvrez un profil.':'Open a profile.'}</div>`;updateDots()}function openPerson(id){let p=P[id];main.innerHTML=`<div class="profile"><div class="profiletop"><div class="portrait">${p.name.split(' ').map(x=>x[0]).join('')}</div><div><h2>${p.name}</h2><div class="rolepill" style="text-align:left;max-width:none">${p.role[S.lang]}</div><div class="sub">${p.status[S.lang]}</div></div></div><div class="facts">${p.facts[S.lang].map(x=>`<div class="fact">${x}</div>`).join('')}</div>${id==='harris'?`<div style="margin-top:18px"><button class="btn" onclick="interviewHarris()">${S.lang==='fr'?'INTERROGER HARRIS':'INTERVIEW HARRIS'}</button></div>`:''}</div>`}function interviewHarris(){main.innerHTML=`<div class="profile"><div class="ey">${S.lang==='fr'?'ENTRETIEN SIMULÉ':'SIMULATED INTERVIEW'}</div><h2>Officer Mark Harris</h2><div class="chat">${S.lang==='fr'?"La plaque correspondait. Le modèle et la couleur aussi. Des affaires d’Emily étaient dans la voiture.":"Plate matched. Make and color matched. Some of Emily's belongings were inside."}</div><button class="choice" onclick="ask('id')">${S.lang==='fr'?"Comment l’identification a-t-elle été faite ?":"How was the vehicle identified?"}</button><button class="choice" onclick="ask('family')">${S.lang==='fr'?"Que vous rappelez-vous de sa famille ?":"What do you remember about her family?"}</button></div>`}function ask(q){if(q==='id'){unlock('F07');unlock('F08');main.innerHTML+=`<div class="chat">${S.lang==='fr'?"L’unité véhicules a traité l’identification et les documents.":"The vehicle unit handled identification and paperwork."}</div>`}else{addPerson('chloe');main.innerHTML+=`<div class="chat">${S.lang==='fr'?"Sa sœur avait seize ans. Chloe. Je ne la mêlerais pas de nouveau à cette affaire.":"Her sister was sixteen. Chloe. I wouldn't drag her back into this."}</div>`}save();updateDots()}function renderNotes(){S.notesSeen=true;save();let established=[];if(S.seen.includes('F01'))established.push(S.lang==='fr'?'Emily Mercer disparaît le 19 avril 2016.':'Emily Mercer disappears on April 19, 2016.');if(S.seen.includes('F05'))established.push(S.lang==='fr'?'Un véhicule portant sa plaque est retrouvé en 2026.':'A vehicle bearing her plate is found in 2026.');if(S.review)established.push(S.lang==='fr'?"L’identification du véhicule de 2016 n’était pas concluante.":'The 2016 vehicle identification was inconclusive.');side.innerHTML=`<div class="ey">${tr('current')}</div><div class="lead ${S.vehicle?'done':'active'}">${S.lang==='fr'?"Comprendre pourquoi l’affaire a été rouverte.":'Understand why the case was reopened.'}</div><div class="lead ${S.review?'done':'active'}">${S.lang==='fr'?"Établir si l’identification de 2016 est fiable.":'Determine whether the 2016 identification is reliable.'}</div>${S.vehicle&&!S.review?`<button class="btn" onclick="review()">${S.lang==='fr'?'EXAMINER CETTE PISTE':'REVIEW THIS LEAD'}</button>`:''}`;main.innerHTML=`<div class="section"><h3>${tr('caseStatus')}</h3><div class="statusblock"><b>${S.lang==='fr'?'Établi à ce stade':'Established so far'}</b>${established.map(x=>`<div class="fact">${x}</div>`).join('')||'<div class="sub">—</div>'}</div><div class="statusblock"><b>Officer Harris</b><div class="sub">${S.lang==='fr'?"Source policière. Ses déclarations doivent être confrontées aux pièces.":"Police source. Compare his statements with documentary evidence."}</div></div></div><div class="section"><h3>${tr('bookmarks')}</h3>${S.bookmarks.map(id=>`<div class="bookmark" onclick="S.tab='files';render();openFile('${id}')">★ ${D[id].title[S.lang]}</div>`).join('')||'<div class="sub">—</div>'}</div><div class="section"><h3>${tr('mynotes')}</h3><textarea class="note" oninput="S.notes=this.value;save()">${S.notes}</textarea></div><div class="section"><h3>${tr('further')}</h3>${researchButtons()}</div>`;updateDots()}function researchButtons(){let qs=S.lang==='fr'?[['Identifier un véhicule après un incendie','vehicle identification after fire VIN forensic'],['Chaîne de conservation des preuves','evidence chain of custody cold case'],['Plaque et identité réelle d’un véhicule','license plate vs VIN vehicle identification']]:[['Identifying a vehicle after a fire','vehicle identification after fire VIN forensic'],['Evidence chain of custody','evidence chain of custody cold case'],['Registration plate vs vehicle identity','license plate vs VIN vehicle identification']];return qs.map(q=>`<button class="research" onclick="window.open('https://www.google.com/search?q='+encodeURIComponent('${q[1]}'),'_blank')">${q[0]} <span>↗</span></button>`).join('')}function review(){if(!S.seen.includes('F10')){alert(S.lang==='fr'?"Pas encore assez d’éléments. Examinez la chaîne d’identification du véhicule.":'Not enough evidence yet. Examine the vehicle-identification trail.');return}main.innerHTML=`<div class="profile"><h2>${S.lang==='fr'?"Que permettent réellement d’établir les pièces ?":"What does the evidence actually establish?"}</h2><button class="choice" onclick="wrong()">${S.lang==='fr'?"Le véhicule incendié était formellement celui d’Emily.":"The burned vehicle was conclusively Emily's."}</button><button class="choice" onclick="correct()">${S.lang==='fr'?"Les pièces ne permettent pas de l’identifier de façon fiable comme celui d’Emily.":"The evidence does not reliably identify it as Emily's original car."}</button></div>`}function wrong(){alert(S.lang==='fr'?"Cette conclusion va au-delà des pièces disponibles.":'That goes beyond the available evidence.')}function correct(){S.review=true;unlock('F11');save();alert(S.lang==='fr'?"AVANCÉE — l’identification de 2016 n’était pas concluante.":'BREAKTHROUGH — the 2016 identification was inconclusive.');S.tab='files';render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});render();</script></body></html>
