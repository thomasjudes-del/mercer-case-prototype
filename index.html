<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mercer Case</title><style>:root{--bg:#0d0f11;--panel:#171a1d;--line:#30353a;--text:#f3f2ef;--muted:#92979c;--gold:#c7ad82;--red:#df4545;--blue:#315f8d;--press:#796127}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:18px 18px 12px}.ey{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font:26px Georgia;margin:5px 0}.meta{font-size:11px;color:var(--muted)}.lang{position:absolute;right:16px;top:18px}.lang button,.btn,.chip{background:#1c2024;color:#ddd;border:1px solid #363c42;border-radius:8px;padding:8px}.lang .on,.chip.on{background:#383e44;color:white}.tabs{display:flex;gap:6px;padding:8px 12px 12px;position:sticky;top:0;background:#0d0f11f5;z-index:3}.tab{position:relative;flex:1}.tab button{width:100%;padding:11px 3px;background:#1d2125;color:#ddd;border:1px solid #363c42;border-radius:9px;font-size:11px}.tab button.on{background:#383e44}.dot{position:absolute;right:8px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}main{padding:0 12px 24px}.toolbar{display:flex;gap:6px;overflow:auto;padding:3px 0 10px}.chip{white-space:nowrap;font-size:11px}.file{width:100%;border:1px solid #343a40;border-radius:9px;background:#181c20;color:#fff;margin:7px 0;padding:0;text-align:left;overflow:hidden}.filein{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:12px;border-left:5px solid var(--blue)}.file.press .filein{border-left-color:var(--press)}.file.read{opacity:.6}.ico{font-size:19px}.sub{font-size:10px;color:#aeb2b6;margin-top:3px}.flags{display:flex;gap:8px;align-items:center}.unread{width:8px;height:8px;background:var(--red);border-radius:50%}.star{font-size:18px;color:#efc75c}.reader{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.rhead{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.rhead h2{font:21px Georgia;margin:0}.source{padding:9px 15px;font-size:10px;color:#aaa;border-bottom:1px solid #292e33}.paper{margin:12px;background:#ebe6dc;color:#222;padding:20px;min-height:330px;font:14px/1.6 Georgia}.people{display:grid;gap:8px}.person{display:grid;grid-template-columns:72px 1fr 18px;min-height:82px;border:1px solid #343a40;border-radius:11px;overflow:hidden;background:#181b1f;color:#fff;text-align:left;padding:0;width:100%}.portraitwrap{height:100%;display:flex;align-items:center;justify-content:center}.person.emily .portraitwrap{background:#6d587a}.person.daniel .portraitwrap{background:#8a6c27}.person.harris .portraitwrap{background:#395a82}.person.chloe .portraitwrap{background:#6d3f6f}.portrait{width:64px;height:64px;border-radius:7px;object-fit:cover}.pinfo{padding:11px 8px}.pname{font-size:16px}.role{font-size:10px;color:var(--gold);text-transform:uppercase;margin-top:3px}.pstatus{font-size:11px;color:#aaa;margin-top:4px}.chev{align-self:center;color:#aaa}.profile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.profiletop{display:flex;gap:14px;align-items:center}.profile .portrait{width:86px;height:86px}.fact{padding:10px 0;border-bottom:1px solid #2b3035}.lead{padding:12px;margin:8px 0;border:1px solid #3a4046;border-radius:9px}.lead.active{border-left:4px solid var(--gold)}.lead.done{opacity:.4;text-decoration:line-through;font-style:italic}.section{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;margin:9px 0}.section h3{font:18px Georgia;margin:0 0 10px}.bookmark{padding:9px 0;border-bottom:1px solid #292e33}.note{width:100%;min-height:120px;background:#101214;color:white;border:1px solid #3c4248;border-radius:8px;padding:10px}.research{display:block;width:100%;text-align:left;background:#1b1f23;color:#ddd;border:1px solid #383e44;border-radius:8px;padding:11px;margin:7px 0}.chat{background:#23282d;padding:12px;border-radius:8px;margin:8px 0}.choice{width:100%;text-align:left;padding:11px;margin:6px 0;border:1px solid #444;border-radius:8px;background:#1c2024;color:#eee}.empty{text-align:center;color:#888;padding:55px 20px}@media(min-width:760px){body{max-width:560px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}}</style></head><body><header class="top"><div class="ey" id="archive">PRIVATE CASE ARCHIVE</div><h1>MERCER / EMILY A.</h1><div class="meta">CASE #16-0419 · <span id="status">STATUS: REOPENED</span></div><div class="lang"><button id="en" onclick="setLang('en')">EN</button><button id="fr" onclick="setLang('fr')">FR</button></div></header><nav class="tabs"><div class="tab"><button id="tf" class="on" onclick="go('files')">CASE FILES</button><i id="df"></i></div><div class="tab"><button id="tp" onclick="go('people')">PEOPLE</button><i id="dp"></i></div><div class="tab"><button id="tn" onclick="go('notes')">NOTEBOOK</button><i id="dn"></i></div></nav><main id="app"></main><script>const T={en:{archive:'PRIVATE CASE ARCHIVE',status:'STATUS: REOPENED',files:'CASE FILES',people:'PEOPLE',notes:'NOTEBOOK',all:'ALL',reports:'REPORTS',photos:'PHOTOS',unread:'UNREAD',saved:'SAVED',leads:'CURRENT LEADS',bookmarks:'BOOKMARKS',mine:'MY NOTES',further:'EXPLORE FURTHER'},fr:{archive:'ARCHIVES PRIVÉES',status:'STATUT : RÉOUVERT',files:'DOSSIER',people:'PERSONNES',notes:'CARNET',all:'TOUT',reports:'RAPPORTS',photos:'PHOTOS',unread:'NON LUS',saved:'SIGNETS',leads:'PISTES EN COURS',bookmarks:'SIGNETS',mine:'MES NOTES',further:'POUR ALLER PLUS LOIN'}};const D={F01:{type:'report',title:{en:'Case Summary — 2016',fr:'Synthèse de l’affaire — 2016'},src:'official',from:{en:'River County Police archive',fr:'Archives de la police du comté'},body:{en:'<h2>Missing Person — Emily A. Mercer</h2><p>Emily Mercer, 24, was reported missing on April 19, 2016. Daniel Reyes said he last saw her that afternoon.</p><p>Two days later, a burned dark gray sedan bearing Emily’s registration plate was recovered off County Road 8.</p>',fr:'<h2>Disparition — Emily A. Mercer</h2><p>Emily Mercer, 24 ans, est portée disparue le 19 avril 2016. Daniel Reyes déclare l’avoir vue pour la dernière fois cet après-midi-là.</p><p>Deux jours plus tard, une berline gris foncé portant sa plaque est retrouvée incendiée près de County Road 8.</p>'}},F02:{type:'report',title:{en:'Burned Vehicle Report',fr:'Rapport — véhicule incendié'},src:'official',from:{en:'Officer Harris / River County Police',fr:'Officer Harris / Police du comté'},body:{en:'<h2>Vehicle Recovery</h2><p>Plate recovered: 8KJ-419. Personal effects: gym bag, bracelet, registration fragments.</p><p>Vehicle transferred for identification.</p>',fr:'<h2>Découverte du véhicule</h2><p>Plaque retrouvée : 8KJ-419. Effets personnels : sac de sport, bracelet, fragments de certificat d’immatriculation.</p><p>Le véhicule est transféré pour identification.</p>'}},F03:{type:'photo',title:{en:'Burned Vehicle — Scene Photo',fr:'Véhicule incendié — Photo de scène'},src:'official',from:{en:'Crime-scene archive',fr:'Archives de scène'},body:{en:'<h2>Scene photograph</h2><p>Evidence image will be added in the next media pass.</p>',fr:'<h2>Photographie de scène</h2><p>La photographie de preuve sera ajoutée lors de la prochaine passe média.</p>'}},F04:{type:'report',title:{en:'Missing Person Bulletin',fr:'Avis de disparition'},src:'press',from:{en:'Public bulletin',fr:'Avis public'},body:{en:'<h2>Missing — Emily Mercer</h2><p>Emily A. Mercer, 24. Dark gray 2008 sedan. Plate 8KJ-419.</p>',fr:'<h2>Disparue — Emily Mercer</h2><p>Emily A. Mercer, 24 ans. Berline gris foncé 2008. Plaque 8KJ-419.</p>'}},F05:{type:'report',title:{en:'Vehicle Recovery — 2026',fr:'Découverte d’un véhicule — 2026'},src:'official',from:{en:'2026 incident report',fr:'Rapport d’intervention 2026'},body:{en:'<h2>Westway Market</h2><p>August 15, 2026. A dark gray 2008 sedan was located in the rear lot. Plate: 8KJ-419. No visible fire damage.</p>',fr:'<h2>Westway Market</h2><p>15 août 2026. Une berline gris foncé de 2008 est retrouvée sur le parking arrière. Plaque : 8KJ-419. Aucune trace visible d’incendie.</p>'}},F06:{type:'photo',title:{en:'Parking Lot — Vehicle Photo',fr:'Parking — Photo du véhicule'},src:'official',from:{en:'Responding officer',fr:'Agent intervenant'},body:{en:'<h2>Recovery photograph</h2><p>Evidence image will be added in the next media pass.</p>',fr:'<h2>Photographie lors de la découverte</h2><p>La photographie de preuve sera ajoutée lors de la prochaine passe média.</p>'}}};const P={emily:{name:'Emily Mercer',img:'assets/emily.jpg',role:{en:'Missing person',fr:'Personne disparue'},status:{en:'Missing since Apr 19, 2016',fr:'Disparue depuis le 19 avril 2016'},facts:{en:['24 at disappearance'],fr:['24 ans lors de sa disparition']}},daniel:{name:'Daniel Reyes',img:'assets/daniel.jpg',role:{en:'Boyfriend at the time',fr:'Compagnon à l’époque'},status:{en:'Interview unavailable',fr:'Entretien indisponible'},facts:{en:['Last known person to see Emily'],fr:['Dernière personne connue à avoir vu Emily']}},harris:{name:'Officer Mark Harris',img:'assets/harris.jpg',role:{en:'Officer on original case',fr:'Agent sur l’enquête initiale'},status:{en:'Available for interview',fr:'Disponible pour entretien'},facts:{en:['Responded to burned vehicle scene'],fr:['Intervenu sur la scène du véhicule incendié']}},chloe:{name:'Chloe Mercer',img:'assets/chloe.jpg',role:{en:'Younger sister',fr:'Sœur cadette'},status:{en:'Interview unavailable',fr:'Entretien indisponible'},facts:{en:['Sixteen in 2016'],fr:['16 ans en 2016']}}};let S=JSON.parse(localStorage.mercerMobile||'null')||{lang:'en',tab:'files',filter:'all',seen:[],book:[],notes:'',peopleSeen:false,notesSeen:false};function save(){localStorage.mercerMobile=JSON.stringify(S)}function tx(k){return T[S.lang][k]}function setLang(l){S.lang=l;render()}function go(t){S.tab=t;if(t==='people')S.peopleSeen=true;if(t==='notes')S.notesSeen=true;render()}function dots(){df.className=D&&Object.keys(D).some(x=>!S.seen.includes(x))?'dot':'';dp.className=!S.peopleSeen?'dot':'';dn.className=!S.notesSeen&&S.seen.length>1?'dot':''}function render(){save();archive.textContent=tx('archive');status.textContent=tx('status');tf.textContent=tx('files');tp.textContent=tx('people');tn.textContent=tx('notes');[tf,tp,tn].forEach(x=>x.classList.remove('on'));({files:tf,people:tp,notes:tn}[S.tab]).classList.add('on');en.classList.toggle('on',S.lang==='en');fr.classList.toggle('on',S.lang==='fr');dots();if(S.tab==='files')files();if(S.tab==='people')people();if(S.tab==='notes')notes()}function files(){let a=Object.keys(D).filter(id=>S.filter==='all'||D[id].type===S.filter||(S.filter==='unread'&&!S.seen.includes(id))||(S.filter==='saved'&&S.book.includes(id)));app.innerHTML='<div class="toolbar">'+[['all',tx('all')],['report',tx('reports')],['photo',tx('photos')],['unread',tx('unread')],['saved',tx('saved')]].map(x=>`<button class="chip ${S.filter===x[0]?'on':''}" onclick="S.filter='${x[0]}';render()">${x[1]}</button>`).join('')+'</div>'+a.map(id=>{let d=D[id];return `<button class="file ${d.src==='press'?'press':''} ${S.seen.includes(id)?'read':''}" onclick="openDoc('${id}')"><div class="filein"><span class="ico">${d.type==='photo'?'▧':'▤'}</span><span><b>${d.title[S.lang]}</b><div class="sub">${d.from[S.lang]}</div></span><span class="flags">${!S.seen.includes(id)?'<i class="unread"></i>':''}${S.book.includes(id)?'<span class="star">★</span>':''}</span></div></button>`}).join('')}function openDoc(id){if(!S.seen.includes(id))S.seen.push(id);save();let d=D[id];app.innerHTML=`<div class="reader"><div class="rhead"><h2>${d.title[S.lang]}</h2><button class="btn" onclick="bookmark('${id}')">${S.book.includes(id)?'★':'☆'}</button></div><div class="source">${d.from[S.lang]} · 16 AUG 2026</div><div class="paper">${d.body[S.lang]}</div></div>`;dots()}function bookmark(id){let i=S.book.indexOf(id);i<0?S.book.push(id):S.book.splice(i,1);save();openDoc(id)}function people(){app.innerHTML='<div class="people">'+Object.entries(P).map(([id,p])=>`<button class="person ${id}" onclick="profile('${id}')"><span class="portraitwrap"><img class="portrait" src="${p.img}"></span><span class="pinfo"><span class="pname">${p.name}</span><div class="role">${p.role[S.lang]}</div><div class="pstatus">${p.status[S.lang]}</div></span><span class="chev">›</span></button>`).join('')+'</div>'}function profile(id){let p=P[id];app.innerHTML=`<div class="profile"><div class="profiletop"><img class="portrait" src="${p.img}"><div><div class="pname">${p.name}</div><div class="role">${p.role[S.lang]}</div><div class="pstatus">${p.status[S.lang]}</div></div></div>${p.facts[S.lang].map(x=>`<div class="fact">${x}</div>`).join('')}${id==='harris'?`<button class="btn" style="margin-top:15px" onclick="interview()">${S.lang==='fr'?'INTERROGER':'INTERVIEW'}</button>`:''}</div>`}function interview(){app.innerHTML+=`<div class="chat">${S.lang==='fr'?"La plaque correspondait. Le modèle et la couleur aussi. C’est ce qu’on avait à ce moment-là.":"The plate matched. Make and color matched too. That's what we had at the time."}</div>`}function notes(){app.innerHTML=`<div class="section"><h3>${tx('leads')}</h3><div class="lead done">${S.lang==='fr'?"Comprendre pourquoi l’affaire a été rouverte.":'Understand why the case was reopened.'}</div><div class="lead active">${S.lang==='fr'?"Déterminer ce que prouve réellement l’identification du véhicule de 2016.":'Determine what the 2016 vehicle identification actually proves.'}</div></div><div class="section"><h3>${tx('bookmarks')}</h3>${S.book.map(id=>`<div class="bookmark">★ ${D[id].title[S.lang]}</div>`).join('')||'—'}</div><div class="section"><h3>${tx('mine')}</h3><textarea class="note" oninput="S.notes=this.value;save()">${S.notes}</textarea></div><div class="section"><h3>${tx('further')}</h3><button class="research" onclick="window.open('https://www.google.com/search?q=vehicle+identification+after+fire+VIN+forensic','_blank')">${S.lang==='fr'?'Identifier un véhicule après un incendie':'Identifying a vehicle after a fire'} ↗</button><button class="research" onclick="window.open('https://www.google.com/search?q=evidence+chain+of+custody+cold+case','_blank')">${S.lang==='fr'?'Chaîne de conservation des preuves':'Evidence chain of custody'} ↗</button></div>`}render();</script></body></html>
