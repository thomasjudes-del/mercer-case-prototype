v><main id="app"></main><script>const T={en:{archive:'PRIVATE CASE ARCHIVE',status:'STATUS: REOPENED',files:'CASE FILES',people:'PEOPLE',notes:'NOTEBOOK',all:'ALL',reports:'REPORTS',photos:'PHOTOS',unread:'UNREAD',saved:'SAVED',leads:'CURRENT LEADS',bookmarks:'BOOKMARKS',mine:'MY NOTES'},fr:{archive:'ARCHIVES PRIVÉES',status:'STATUT : RÉOUVERT',files:'DOSSIER',people:'PERSONNES',notes:'CARNET',all:'TOUT',reports:'RAPPORTS',photos:'PHOTOS',unread:'NON LUS',saved:'SIGNETS',leads:'PISTES EN COURS',bookmarks:'SIGNETS',mine:'MES NOTES'}};const D={F01:{type:'report',title:{en:'Case Summary — 2016',fr:'Synthèse de l’affaire — 2016'},src:'official',from:{en:'River County Police archive',fr:'Archives de la police du comté'},body:{en:'<h2>Missing Person — Emily A. Mercer</h2><p>Emily Mercer, 24, was reported missing on April 19, 2016. Daniel Reyes said he last saw her that afternoon.</p><p>Two days later, a burned dark gray sedan bearing Emily’s registration plate was recovered off County Road 8.</p>',fr:'<h2>Disparition — Emily A. Mercer</h2><p>Emily Mercer, 24 ans, est portée disparue le 19 avril 2016. Daniel Reyes déclare l’avoir vue pour la dernière fois cet après-midi-là.</p><p>Deux jours plus tard, une berline gris foncé portant sa plaque est retrouvée incendiée près de County Road 8.</p>'}},F02:{type:'report',title:{en:'Burned Vehicle Report',fr:'Rapport — véhicule incendié'},src:'official',from:{en:'Officer Harris / River County Police',fr:'Officer Harris / Police du comté'},body:{en:'<h2>Vehicle Recovery</h2><p>Plate recovered: <b>482-LZK</b>. Personal effects: gym bag, bracelet, registration fragments.</p><p>Vehicle transferred for identification.</p>',fr:'<h2>Découverte du véhicule</h2><p>Plaque retrouvée : <b>482-LZK</b>. Effets personnels : sac de sport, bracelet, fragments de certificat d’immatriculation.</p><p>Le véhicule est transféré pour identification.</p>'}},F03:{type:'photo',title:{en:'Burned Vehicle — Scene Photo',fr:'Véhicule incendié — Photo de scène'},src:'official',from:{en:'Crime-scene archive',fr:'Archives de scène'},body:{en:'<h2>Scene photograph</h2><div class="ev burn"></div><p>County Road 8 · April 21, 2016.</p>',fr:'<h2>Photographie de scène</h2><div class="ev burn"></div><p>County Road 8 · 21 avril 2016.</p>'}},F04:{type:'report',title:{en:'Missing Person Bulletin',fr:'Avis de disparition'},src:'press',from:{en:'Public bulletin / local press',fr:'Avis public / presse locale'},body:{en:'<h2>Missing — Emily Mercer</h2><p>Emily A. Mercer, 24. Dark gray 2008 sedan. Plate <b>482-LZK</b>.</p>',fr:'<h2>Disparue — Emily Mercer</h2><p>Emily A. Mercer, 24 ans. Berline gris foncé 2008. Plaque <b>482-LZK</b>.</p>'}},F05:{type:'report',title:{en:'Vehicle Recovery — 2026',fr:'Découverte d’un véhicule — 2026'},src:'official',from:{en:'2026 incident report',fr:'Rapport d’intervention 2026'},body:{en:'<h2>Westway Market</h2><p>August 15, 2026. A dark gray 2008 sedan was located in the rear lot. Plate: <b>482-LZK</b>. No visible fire damage.</p>',fr:'<h2>Westway Market</h2><p>15 août 2026. Une berline gris foncé de 2008 est retrouvée sur le parking arrière. Plaque : <b>482-LZK</b>. Aucune trace visible d’incendie.</p>'}},F06:{type:'photo',title:{en:'Parking Lot — Vehicle Photo',fr:'Parking — Photo du véhicule'},src:'official',from:{en:'Responding officer',fr:'Agent intervenant'},body:{en:'<h2>Recovery photograph</h2><div class="ev parking"></div><p>Westway Market · August 15, 2026.</p>',fr:'<h2>Photographie lors de la découverte</h2><div class="ev parking"></div><p>Westway Market · 15 août 2026.</p>'}},F07:{type:'photo',title:{en:'Vehicle — Plate Close-up',fr:'Véhicule — Gros plan de la plaque'},src:'official',from:{en:'Crime-scene archive',fr:'Archives de scène'},body:{en:'<h2>Registration plate</h2><div class="ev plate"></div><p>Plate visible: <b>482-LZK</b>.</p>',fr:'<h2>Plaque d’immatriculation</h2><div class="ev plate"></div><p>Plaque visible : <b>482-LZK</b>.</p>'}}};const P={emily:{name:'Emily Mercer',role:{en:'Missing person',fr:'Personne disparue'},status:{en:'Missing since Apr 19, 2016',fr:'Disparue depuis le 19 avril 2016'}},daniel:{name:'Daniel Reyes',role:{en:'Boyfriend at the time',fr:'Compagnon à l’époque'},status:{en:'Interview unavailable',fr:'Entretien indisponible'}},harris:{name:'Officer Mark Harris',role:{en:'Officer on original case',fr:'Agent sur l’enquête initiale'},status:{en:'Available for interview',fr:'Disponible pour entretien'}},chloe:{name:'Chloe Mercer',role:{en:'Younger sister',fr:'Sœur cadette'},status:{en:'Interview unavailable',fr:'Entretien indisponible'}}};let S=JSON.parse(localStorage.mercerMedia||'null')||{lang:'en',tab:'files',filter:'all',seen:[],book:[],notes:'',people:['emily','daniel','harris'],peopleSeen:false,notesSeen:false};function save(){localStorage.mercerMedia=JSON.stringify(S)}function tx(k){return T[S.lang][k]}function setLang(l){S.lang=l;render()}function go(t){S.tab=t;if(t==='people')S.peopleSeen=true;if(t==='notes')S.notesSeen=true;render()}function dots(){df.className=Object.keys(D).some(x=>!S.seen.includes(x))?'dot':'';dp.className=!S.peopleSeen?'dot':'';dn.className=!S.notesSeen&&S.seen.length>1?'dot':''}function render(){save();archive.textContent=tx('archive');status.textContent=tx('status');tf.textContent=tx('files');tp.textContent=tx('people');tn.textContent=tx('notes');[tf,tp,tn].forEach(x=>x.classList.remove('on'));({files:tf,people:tp,notes:tn}[S.tab]).classList.add('on');en.classList.toggle('on',S.lang==='en');fr.classList.toggle('on',S.lang==='fr');dots();if(S.tab==='files')files();if(S.tab==='people')people();if(S.tab==='notes')notes()}function files(){let a=Object.keys(D).filter(id=>S.filter==='all'||D[id].type===S.filter||(S.filter==='unread'&&!S.seen.includes(id))||(S.filter==='saved'&&S.book.includes(id)));app.innerHTML='<div class="toolbar">'+[['all',tx('all')],['report',tx('reports')],['photo',tx('photos')],['unread',tx('unread')],['saved',tx('saved')]].map(x=>`<button class="chip ${S.filter===x[0]?'on':'' Des affaires d’Emily étaient dans la voiture.":"Plate matched. Make and color matched. Some of Emily's belongings were inside."}</div><button class="choice" onclick="ask()">${S.lang==='fr'?"Que vous rappelez-vous de sa famille ?":"What do you remember about her family?"}</button></div>`}function ask(){if(!S.people.includes('chloe'))S.people.push('chloe');S.peopleSeen=false;save();app.innerHTML+=`<div class="chat">${S.lang==='fr'?"Sa sœur avait seize ans. Chloe. Je ne la mêlerais pas de nouveau à cette affaire.":"Her sister was sixteen. Chloe. I wouldn't drag her back into this."}</div>`;dots()}function notes(){S.notesSeen=true;save();app.innerHTML=`<div class="section"><h3>${tx('leads')}</h3><div class="lead done">${S.lang==='fr'?"Comprendre pourquoi l’affaire a été rouverte.":"Understand why the case was reopened."}</div><div class="lead active">${S.lang==='fr'?"Établir si l’identification du véhicule de 2016 est fiable.":"Determine whether the 2016 vehicle identification is reliable."}</div></div><div class="section"><h3>${tx('bookmarks')}</h3>${S.book.map(id=>`<div class="bookmark" onclick="go('files');openDoc('${id}')">★ ${D[id].title[S.lang]}</div>`).join('')||'—'}</div><div class="section"><h3>${tx('mine')}</h3><textarea class="note" oninput="S.notes=this.value;save()">${S.notes}</textarea></div>`;dots()}render();</script></body></html>
