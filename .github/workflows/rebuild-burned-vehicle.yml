name: Rebuild burned vehicle asset
on:
  push:
    branches: [main]
    paths:
      - 'assets/staging/READY'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat assets/staging/part-* > /tmp/burned.b64
          base64 -d /tmp/burned.b64 > assets/evidence/burned-vehicle-roadside-hd.jpg
          test "$(wc -c < assets/evidence/burned-vehicle-roadside-hd.jpg)" = "89177"
          echo "829f1896cf7b0353f89d0c8ecc47fca5032abaf00eb25f2e8b33af3f2a8e214b  assets/evidence/burned-vehicle-roadside-hd.jpg" | sha256sum -c -
          rm -rf assets/staging
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/evidence/burned-vehicle-roadside-hd.jpg assets/staging
          git commit -m "Rebuild real burned vehicle JPEG asset"
          git push
