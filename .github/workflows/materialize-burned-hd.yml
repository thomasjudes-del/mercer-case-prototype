name: Materialize burned vehicle HD
on:
  push:
    branches: [main]
    paths:
      - 'assets/staging/READY'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat assets/staging/bin-* > assets/evidence/burned-vehicle-roadside-hd.jpg
          test "$(stat -c%s assets/evidence/burned-vehicle-roadside-hd.jpg)" -eq 70862
          echo "81e6c49c557898ce57685fb4849673670c8fd5f60a858328ca9663544764bf07  assets/evidence/burned-vehicle-roadside-hd.jpg" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/evidence/burned-vehicle-roadside-hd.jpg')
          assert im.size == (1240,820), im.size
          im.verify()
          print('validated 1240x820 JPEG')
          PY
      - name: Cleanup transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/staging
          rm -f assets/evidence/burned-vehicle-roadside-hd.avif
          rm -f assets/evidence/.candidate-q50.jpg
          rm -f .github/workflows/materialize-burned-hd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize verified burned vehicle JPEG [skip ci]'
          git push origin main
