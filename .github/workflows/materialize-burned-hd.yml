name: Materialize burned vehicle HD
on:
  push:
    branches: [mercer-burned-hd-final]
    paths:
      - 'assets/staging/READY'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mercer-burned-hd-final
          fetch-depth: 0
      - name: Rebuild and verify JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat assets/staging/part-* | tr -d '\n\r ' > /tmp/burned.b64
          base64 -d /tmp/burned.b64 > assets/evidence/burned-vehicle-roadside-hd.jpg
          test "$(stat -c%s assets/evidence/burned-vehicle-roadside-hd.jpg)" -eq 254641
          echo "4ade8b685b2c2faee690eb7fe6f1311e9a06d2801c0f9da7d71509b6d7b6e0cf  assets/evidence/burned-vehicle-roadside-hd.jpg" | sha256sum -c -
      - name: Wire verified JPEG and bump cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/evidence/burned-vehicle-roadside-hd.avif?v=20260822f','assets/evidence/burned-vehicle-roadside-hd.jpg?v=20260822g')
          s=s.replace('assets/media-tools.js?v=10','assets/media-tools.js?v=11')
          p.write_text(s)
          p=Path('assets/media-tools.js')
          s=p.read_text()
          s=s.replace("file:'burned-vehicle-roadside.jpg',asset:'assets/evidence/burned-vehicle-roadside-hd.avif',width:1448,height:1086","file:'burned-vehicle-roadside-hd.jpg',asset:'assets/evidence/burned-vehicle-roadside-hd.jpg',width:1240,height:820")
          s=s.replace("file:'burned-vehicle-roadside.jpg',asset:'assets/evidence/burned-vehicle-roadside.jpg',width:1448,height:1086","file:'burned-vehicle-roadside-hd.jpg',asset:'assets/evidence/burned-vehicle-roadside-hd.jpg',width:1240,height:820")
          p.write_text(s)
          PY
      - name: Cleanup and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/staging
          rm -f assets/evidence/burned-vehicle-roadside-hd.avif
          rm -f .github/workflows/materialize-burned-hd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use verified burned vehicle HD JPEG [skip ci]'
          git push origin HEAD:mercer-burned-hd-final
