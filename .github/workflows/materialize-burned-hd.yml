name: Materialize burned vehicle image
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Rebuild and verify JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat assets/staging/c720-* | tr -d '\n\r ' > /tmp/burned.b64
          base64 -d /tmp/burned.b64 > assets/evidence/burned-vehicle-roadside-hd.jpg
          test "$(stat -c%s assets/evidence/burned-vehicle-roadside-hd.jpg)" -eq 21380
          echo "95fc1d3f52f6e0f951c261683796e466ba0c449494baea933bdad25911b853e6  assets/evidence/burned-vehicle-roadside-hd.jpg" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/evidence/burned-vehicle-roadside-hd.jpg')
          assert im.size == (720,476), im.size
          im.verify()
          print('validated 720x476 JPEG')
          PY
      - name: Commit verified asset to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/staging
          rm -f assets/evidence/burned-vehicle-roadside-hd.avif
          rm -f assets/evidence/.candidate-q50.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize verified burned vehicle image'
          git push origin HEAD:${{ github.head_ref }}
