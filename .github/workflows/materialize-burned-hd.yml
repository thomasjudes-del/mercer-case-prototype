name: Materialize burned vehicle HD
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'Promote burned HD transfer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode, verify and switch image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/evidence
          cat assets/import-burned-hd/q15-*.b64 | tr -d '\n\r ' | base64 -d > assets/evidence/burned-vehicle-roadside-hd.jpg
          test "$(stat -c%s assets/evidence/burned-vehicle-roadside-hd.jpg)" -eq 39836
          echo '902d4f4ae56524e920a8467970bcd6b3f49beda64f549eeed49899ebc1b422d6  assets/evidence/burned-vehicle-roadside-hd.jpg' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/style.css')
          s=p.read_text()
          old='background-image:url("evidence/burned-vehicle-roadside-hd.png?v=20260822a")'
          new='background-image:url("evidence/burned-vehicle-roadside-hd.jpg?v=20260822d")'
          if old not in s:
              raise SystemExit('old burned image reference not found')
          p.write_text(s.replace(old,new,1))
          i=Path('index.html')
          h=i.read_text()
          if 'assets/style.css?v=6' not in h:
              raise SystemExit('style cache marker not found')
          i.write_text(h.replace('assets/style.css?v=6','assets/style.css?v=7',1))
          PY
      - name: Cleanup transfer files and obsolete assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/import-burned-hd assets/staging
          rm -f assets/evidence/burned-vehicle-roadside-hd.png
          rm -f assets/evidence/burned-vehicle-roadside.jpg
          rm -f .github/workflows/rebuild-burned-vehicle.yml
          rm -f .github/workflows/materialize-burned-hd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use verified HD burned vehicle photo [skip ci]'
          git push origin HEAD:main
