name: Materialize burned vehicle HD
on:
  push:
    branches: [main]
    paths:
      - 'assets/staging/READY'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat assets/staging/part-* | tr -d '\n\r ' > /tmp/burned.b64
          base64 -d /tmp/burned.b64 > assets/evidence/burned-vehicle-roadside-hd.jpg
          test "$(stat -c%s assets/evidence/burned-vehicle-roadside-hd.jpg)" -eq 102423
          echo "b1fc948e529b8a87be27414e3eca67d72189d318d8627021ed6e8f307c01323f  assets/evidence/burned-vehicle-roadside-hd.jpg" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/evidence/burned-vehicle-roadside-hd.jpg')
          assert im.size == (1240,820), im.size
          print('validated', im.size)
          PY
      - name: Cleanup transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/staging
          rm -f assets/evidence/burned-vehicle-roadside-hd.avif
          rm -f .github/workflows/materialize-burned-hd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize verified burned vehicle HD JPEG [skip ci]'
          git push origin main
